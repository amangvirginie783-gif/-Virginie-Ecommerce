<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   <style type="text/tailwindcss">
        @layer components {
      .container {
        @apply w-full mx-auto px-4  sm:px-10 md:px-20 lg:px-40;
        /* @apply flex justify-center items-center flex-wrap mx-auto w-[600px]; */

      }
      
    }
  </style>
</head>

<body class="text-black text-[7px]container ">

<header class="border-b  border-b-[#F0EEF0] flex py-5 px-2 md:py-8 justify-center ">
        <img src="../assets/logo.png" alt="" class="h-6 md:h-7 w-auto">
    </header>

<main class="w-[92%] w-[320px] mx-auto px-4 ">

  <h1 class="font-semibold text-[20px] md:text-[22px]  mt-4 mb-4">Login</h1>

  <form class="bg-[#fcfcfc] rounded-xl p-2">

    <div class="flex gap-2 mb-3 mt-2 text-[12px] md:text-[14px]">
      <button class="flex flex-row  border border-[#F8F7F8] bg-[#F8F7F8]  rounded-md w-[100px] h-[40px] text-black py-2 justify-center gap-2">
    <img src="../assets/Email.png" alt="" class="w-4 md:w-5 h-4 md:h-5">
    <span>Email</span>
</button>

      <button class="flex h-5 rounded-md bg-[#F8F7F8] w-[90px] h-[40px] text-black py-2  flex justify-center items-center gap-2">
        <img src="../assets/phone.png" class="w-4 h-4 md:w-5 md:h-5"> Phone
      </button>
    </div>

    <label class="text-[12px] md:text-[14px] md:text-[16px] ">Email</label>
    <input type="email" placeholder="Enter your email"
      class="w-full h-7 md:h-8 mt-1 px-2 bg-white rounded border border-[#f5f5f5] text-[12px] md:text-[14px] focus:boder-[#B5179E] focus:outline-none">

    <button type="submit"
      class="w-full h-7 md:h-8 mt-6 rounded-full bg-[#b6349a] text-white flex  text-[9px] md:text-[12px] justify-center items-center gap-1">
      Continue <img src="../assets/arrow-right.svg" class="w-3">
    </button>

  </form>

  <div class="flex items-center gap-2 my-4  text-[10px] md:text-[14px]  text-[#999]">
    <span class="h-px bg-[#eee] flex-1"></span>or<span class="h-px bg-[#eee] flex-1"></span>
  </div>

  <button class="w-full h-7 md:h-8 mb-2 rounded-full  text-[10px] md:text-[14px]  bg-[#f8f7f8] text-[#b6349a] flex justify-center items-center gap-1 md:gap-2">
    <img src="../assets/meta.png" class="w-3 md:w-4"> Sign in with Meta
  </button>

  <button class="w-full h-7 md:h-8 rounded-full text-[10px] md:text-[14px]  bg-[#f8f7f8] flex justify-center items-center gap-1">
    <img src="../assets/google.png" class="w-3 md:w-4"> Sign in with Google
  </button>

</main>

</body>
</html>
