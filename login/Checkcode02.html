<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @layer components {
      .container {
        @apply w-full mx-auto px-4  sm:px-10 md:px-20 lg:px-40;
        /* @apply flex justify-center items-center flex-wrap mx-auto w-[600px]; */

<body class="bg-white text-black min-h-screen">
    <header class="border-b  border-b-[#F0EEF0] flex py-5 px-2 md:py-8 justify-center ">

    </header>

    <main class="container">
        <div class="w-full max-w-sm mx-auto pt-6 md:pt-16">
            <button type="button" aria-label="Go back"

                <img src="../assets/arrow-left.svg" alt="" class="w-4 h-4"></button>


            <h1 class="text-lg md:text-xl font-semibold mb-4 text-black">Enter verification code</h1>
            <div class="rounded-2xl bg-[#FAFAFA] p-4 md:p-5">
                <p class="text-xs md:text-sm tetx-gray-500">
                    We sent a 6-digit code
                </p>
                <p class="text-sm md:text-base font-semibold mb-4">
                    +237 6 -- -- -- 85
                </p>
                <div class="flex justify-center gap-2 sm:gap-3">
                    <input type="text" inputmode="numeric" maxlength="1" placeholder="0" aria-label="1"
                        class="otp w-11 h-11 md:w-12 md:h-12 text-center text-lg md:text-xl rounded-lg border border-[#F0EEF0] bg-white placeholder-gray-300 focus:boder-[#B5179E] focus:outline-none">
                    <input type="text" inputmode="numeric" maxlength="1" placeholder="0" aria-label="1"
                        class="otp w-11 h-11 md:w-12 md:h-12 text-center text-lg md:text-xl rounded-lg border border-[#F0EEF0] bg-white placeholder-gray-300 focus:boder-[#B5179E] focus:outline-none">
                    <input type="text" inputmode="numeric" maxlength="1" placeholder="0" aria-label="1"
                        class="otp w-11 h-11 md:w-12 md:h-12 text-center text-lg md:text-xl rounded-lg border border-[#F0EEF0] bg-white placeholder-gray-300 focus:boder-[#B5179E] focus:outline-none">
                    <input type="text" inputmode="numeric" maxlength="1" placeholder="0" aria-label="1"
                        class="otp w-11 h-11 md:w-12 md:h-12 text-center text-lg md:text-xl rounded-lg border border-[#F0EEF0] bg-white placeholder-gray-300 focus:boder-[#B5179E] focus:outline-none">


                </div>

            </div>
            <p class="mt-3 text-xs md:text=sm font-meduim">
                Haven't recieved your code?
                <a href="#" class="text-[#B5179E] font-semibold hover:underline"> Request a New Code</a>
            </p>
        </div>
    </main>
</body>

</html>
