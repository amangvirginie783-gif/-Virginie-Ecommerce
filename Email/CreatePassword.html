<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   <style type="text/tailwindcss">
        @layer components {
      .container {
        @apply w-full mx-auto px-4  sm:px-10 md:px-20 lg:px-40;
        /* @apply flex justify-center items-center flex-wrap mx-auto w-[600px]; */

      }
      
    }
  </style>
</head>

<body class="text-black text-[7px]container ">

<header class="border-b  border-b-[#F0EEF0] flex py-5 px-2 md:py-8 justify-center ">
        <img src="../assets/logo.png" alt="" class="h-6 md:h-7 w-auto">
</header>
      
<main class="container">
        <div class="w-full max-w-sm mx-auto pt-6 md:pt-16">
            <button type="button" aria-label="Go back"
                class="flex items-center justify-center border border-[#F0EEF0] rounded-full w-[30px] h-[30px] mb-4 md:mb-6">
                <img src="../assets/arrow-left.svg" alt="" class="w-4 h-4"></button>


            <h1 class="text-lg md:text-xl font-semibold mb-4 text-black">Create a password</h1>
           <form class="bg-[#fcfcfc] rounded-xl p-2">

    <label class="text-[13px]">Password</label>
    <input type="email" placeholder="Password"
      class="w-full h-9 mt-2 px-2 bg-white rounded border border-[#f5f5f5] text-[12px]">

    <button type="submit"
      class="w-full h-9 mt-5 rounded-full bg-[#b6349a] text-white flex  text-[9px] justify-center items-center gap-1">
      Continue <img src="../assets/arrow-right.svg" class="w-2.5">
    </button>
    <div class="text-[12px]">
    <p class="flex gap-1 mt-5">
      <img src="../assets/correct.png" alt="tick" class="w-4 h-4 ">
      <span> Must be at least 8 characters long</span>
    </p>
<p class="flex gap-1 mt-5">
      <img src="../assets/correct.png" alt="tick" class="w-4 h-4 ">
      <span> Include at least one uppercase latter (A-Z)</span>
    </p>
    <p class="flex gap-1 mt-5">
      <img src="../assets/correct.png" alt="tick" class="w-4 h-4 ">
      <span> No space allowed</span>
    </p>
    <p class="flex gap-1 mt-5">
      <img src="../assets/correct.png" alt="tick" class="w-4 h-4 ">
      <span> Include at least one number (0-9)</span>
    </p>
    </div>
  </form>
        </div>
    </main>
</body>
</html>
